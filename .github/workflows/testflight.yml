name: TestFlight

# 手動トリガーのみ。push のたびに配信するとTestFlightにビルドが溜まり、
# テスターにも通知が飛び続けるため、上げたいときだけ実行する。
on:
  workflow_dispatch:
    inputs:
      whats_new:
        description: "テスターに表示する変更点（省略可）"
        required: false
        type: string

jobs:
  upload:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      # 証明書とProvisioning Profileは -allowProvisioningUpdates で
      # Xcodeに取得させる。そのためAPIキーをxcodebuildが読める場所に置く。
      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          if [ -z "$ASC_API_KEY_P8" ] || [ -z "$ASC_API_KEY_ID" ]; then
            echo "::error::ASC_API_KEY_P8 / ASC_API_KEY_ID が未設定です。リポジトリのSecretsを確認してください。"
            exit 1
          fi
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_API_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

      - name: Archive
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -o pipefail
          # ビルド番号はワークフローの実行番号。App Store Connectは
          # 同じ (バージョン, ビルド番号) の組を二度受け付けないため、必ず増える値を使う。
          xcodebuild archive \
            -project EitangoApp.xcodeproj \
            -scheme EitangoApp \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/EitangoApp.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export and upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -o pipefail
          # ExportOptions.plist の destination=upload により、書き出しと同時に送信される
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/EitangoApp.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf "$HOME/private_keys"

      - name: Summary
        if: success()
        run: |
          {
            echo "### TestFlightへアップロードしました"
            echo ""
            echo "- バージョン: 1.0 (ビルド ${{ github.run_number }})"
            echo "- コミット: ${{ github.sha }}"
            echo ""
            echo "App Store Connectでの処理完了後、TestFlightに表示されます（通常5〜15分）。"
            if [ -n "${{ inputs.whats_new }}" ]; then
              echo ""
              echo "変更点: ${{ inputs.whats_new }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
