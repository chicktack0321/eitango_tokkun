name: Store Screenshots

# App Store に載せるスクリーンショットを作る。
# 通常のCIは「見た目が壊れていないか」を見るためのもので端末は自動選択だが、
# 提出用は寸法が決まっているため、機種を固定して撮る必要がある。
# 頻繁には要らないので手動実行のみ。
on:
  workflow_dispatch:
    inputs:
      edition:
        description: "撮影するエディション"
        required: true
        default: G2
        type: choice
        options:
          - G2
          - GP2
      device:
        description: "撮影に使うシミュレータ"
        required: true
        default: "iPhone 16 Pro Max"
        type: string

jobs:
  capture:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve edition
        id: ed
        run: |
          case "${{ inputs.edition }}" in
            G2)  scheme=EitangoApp; uitests=EitangoAppUITests ;;
            GP2) scheme=EitangoGP2; uitests=EitangoGP2UITests ;;
            *)   echo "::error::未対応のエディション: ${{ inputs.edition }}"; exit 1 ;;
          esac
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "uitests=$uitests" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen and xcparse
        run: |
          brew install xcodegen
          brew install chargepoint/xcparse/xcparse

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      # 6.9インチ（1320×2868）を出しておけば、6.5インチの掲載は省略できる。
      # 機種が見つからないまま別端末で撮ると寸法違いで審査に弾かれるため、
      # 見つからなければここで止める。
      - name: Resolve simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          name = '''${{ inputs.device }}'''
          data = json.load(sys.stdin)
          for devices in data['devices'].values():
              for d in devices:
                  if d['name'] == name:
                      print(d['udid'])
                      raise SystemExit
          raise SystemExit('not found')
          ")
          if [ -z "$UDID" ]; then
            echo "::error::シミュレータ「${{ inputs.device }}」が見つかりません。利用可能な機種は次のとおりです。"
            xcrun simctl list devices available | grep iPhone
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "撮影に使用: ${{ inputs.device }} ($UDID)"

      - name: Capture screenshots
        run: |
          set -o pipefail
          xcodebuild test \
            -project EitangoApp.xcodeproj \
            -scheme ${{ steps.ed.outputs.scheme }} \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:${{ steps.ed.outputs.uitests }} \
            -resultBundlePath StoreShots.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Extract screenshots
        if: always()
        run: |
          mkdir -p store-screenshots
          xcparse screenshots StoreShots.xcresult store-screenshots || true
          echo "--- 撮影した画像と寸法 ---"
          for f in store-screenshots/*.png; do
            [ -f "$f" ] || continue
            size=$(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/{printf "%s ", $2}')
            echo "$size $(basename "$f")"
          done

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-${{ inputs.edition }}
          path: store-screenshots
          if-no-files-found: error
