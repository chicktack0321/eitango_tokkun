name: EitangoApp

options:
  bundleIdPrefix: com.eitango.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  EitangoApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: EitangoApp
        excludes:
          - "App/Info.plist"

    # `info:` は「指定パスにInfo.plistを生成する」指定であり、手書きのInfo.plistを
    # xcodegen generate のたびに上書きしてしまう。実際、CFBundleDisplayName /
    # ITSAppUsesNonExemptEncryption / UIBackgroundModes が全てビルドから抜け落ちていた
    # （聞き流しのバックグラウンド再生が動かない状態だった）。
    # 既存のファイルをそのまま使わせるため INFOPLIST_FILE を直接指定する。
    settings:
      base:
        INFOPLIST_FILE: EitangoApp/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.eitango.app
        # 日本語＋スペースの PRODUCT_NAME はバンドル名・モジュール名・ビルドパスに波及し、
        # テストターゲットの TEST_HOST 解決に失敗する。ホーム画面に出る名前は
        # Info.plist の CFBundleDisplayName（英検2級 英単語特訓）が担うため、ここはASCIIで固定する。
        PRODUCT_NAME: EitangoApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        # TestFlightへ上げるたびにワークフローの実行番号で上書きする（同じ番号は再アップロードできない）
        CURRENT_PROJECT_VERSION: "1"
        # 証明書とProvisioning ProfileはApp Store Connect APIキー経由でXcodeに作らせる。
        # 手元にMacが無く、証明書を手動で書き出して秘密として持ち回ることができないため。
        DEVELOPMENT_TEAM: 5PT8D8SKN8
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES

  EitangoAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: EitangoAppTests

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eitango.app.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

    dependencies:
      - target: EitangoApp

  EitangoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: EitangoAppUITests

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eitango.app.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

    dependencies:
      - target: EitangoApp

schemes:
  EitangoApp:
    build:
      targets:
        EitangoApp: all
        EitangoAppTests: [test]
        EitangoAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EitangoAppTests
        - EitangoAppUITests
    archive:
      config: Release
