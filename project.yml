name: EitangoApp

options:
  bundleIdPrefix: com.eitango.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

# エディション（級）を増やすときは targets に1件足すだけで済むようにする。
# 共通コードは EitangoApp/ 側が全ターゲットで同じファイルを参照するため、
# 改善や不具合修正の反映漏れが構造的に起きない。
targetTemplates:
  EditionApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      # 共通コード。級に依存する値は一切持たない（EditionSpec 経由で参照する）
      - path: EitangoApp
      # 級ごとに差し替わるもの: Edition.swift / Assets.xcassets / 同梱seed。
      # Info.plist は INFOPLIST_FILE で指定するのでリソースとして取り込まない。
      # Products.storekit はUIテスト用なので製品には同梱しない。
      - path: Editions/${edition_dir}
        excludes:
          - "Info.plist"
          - "Products.storekit"

    # `info:` は「指定パスにInfo.plistを生成する」指定であり、手書きのInfo.plistを
    # xcodegen generate のたびに上書きしてしまう。実際、CFBundleDisplayName /
    # ITSAppUsesNonExemptEncryption / UIBackgroundModes が全てビルドから抜け落ちていた
    # （聞き流しのバックグラウンド再生が動かない状態だった）。
    # 既存のファイルをそのまま使わせるため INFOPLIST_FILE を直接指定する。
    settings:
      base:
        INFOPLIST_FILE: Editions/${edition_dir}/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: ${bundle_id}
        # 日本語＋スペースの PRODUCT_NAME はバンドル名・モジュール名・ビルドパスに波及し、
        # テストターゲットの TEST_HOST 解決に失敗する。ホーム画面に出る名前は
        # Info.plist の CFBundleDisplayName が担うため、ここはASCIIで固定する。
        PRODUCT_NAME: ${product_name}
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        # TestFlightへ上げるたびにワークフローの実行番号で上書きする（同じ番号は再アップロードできない）
        CURRENT_PROJECT_VERSION: "1"
        # 証明書とProvisioning ProfileはApp Store Connect APIキー経由でXcodeに作らせる。
        # 手元にMacが無く、証明書を手動で書き出して秘密として持ち回ることができないため。
        DEVELOPMENT_TEAM: 5PT8D8SKN8
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES

targets:
  # 英検2級（公開済み）。ターゲット名・bundle ID・PRODUCT_NAME は変更禁止。
  # CI の -scheme、テストの TEST_HOST、App Store の同一性がすべてこれに依存する。
  EitangoApp:
    templates: [EditionApp]
    templateAttributes:
      edition_dir: G2
      bundle_id: com.eitango.app
      product_name: EitangoApp

  # 英検準2級（パイロット）。増える差分は Editions/GP2/ の中だけで、
  # アプリのコードは EitangoApp と同一のものをコンパイルする。
  EitangoGP2:
    templates: [EditionApp]
    templateAttributes:
      edition_dir: GP2
      bundle_id: com.eitango.gp2
      product_name: EitangoGP2

  # 英検準1級。2級コアの非選抜語＋準1級専用の新規語を core（¥600）にする。
  EitangoGP1:
    templates: [EditionApp]
    templateAttributes:
      edition_dir: GP1
      bundle_id: com.eitango.gp1
      product_name: EitangoGP1

  # 英検1級。準1級コアからの選抜を bridge、1級専用の新規語を core（¥800）にする。
  EitangoG1:
    templates: [EditionApp]
    templateAttributes:
      edition_dir: G1
      bundle_id: com.eitango.g1
      product_name: EitangoG1

  # 英検3級（無料）。課金が無いので Products.storekit を持たない。
  EitangoG3:
    templates: [EditionApp]
    templateAttributes:
      edition_dir: G3
      bundle_id: com.eitango.g3
      product_name: EitangoG3

  # 英検4級（無料）。同上。
  EitangoG4:
    templates: [EditionApp]
    templateAttributes:
      edition_dir: G4
      bundle_id: com.eitango.g4
      product_name: EitangoG4

  EitangoAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: EitangoAppTests

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eitango.app.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

    dependencies:
      - target: EitangoApp

  EitangoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: EitangoAppUITests
      # 審査用スクリーンショットの撮影で、テスト用のストアを立てるのに読み込む。
      # スキーム側の指定ではストアフロントを日本にできず、ドル表記になってしまうため、
      # UIテストから SKTestSession で明示的に設定する。
      - path: Editions/G2/Products.storekit
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eitango.app.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

    dependencies:
      - target: EitangoApp

  # 審査用スクリーンショット（testCapturePurchaseScreen）は、そのエディションの
  # アプリを起動して撮る必要がある。テストのソースは EitangoAppUITests と同じものを
  # コンパイルし、依存先と読み込む storekit だけが違う。
  # 単体テストは共通ロジックの検証なので G2 側だけでよく、ここでは増やさない。
  EitangoGP2UITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: EitangoAppUITests
      - path: Editions/GP2/Products.storekit
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eitango.gp2.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

    dependencies:
      - target: EitangoGP2

  EitangoGP1UITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: EitangoAppUITests
      - path: Editions/GP1/Products.storekit
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eitango.gp1.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

    dependencies:
      - target: EitangoGP1

  EitangoG1UITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: EitangoAppUITests
      - path: Editions/G1/Products.storekit
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eitango.g1.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

    dependencies:
      - target: EitangoG1

  # 掲載用スクリーンショットの撮影に使う。課金が無いので storekit は同梱せず、
  # 審査用の購入画面を撮るテストは自分で skip する（バンドルに storekit が無いことで判定）。
  EitangoG3UITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: EitangoAppUITests

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eitango.g3.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

    dependencies:
      - target: EitangoG3

  EitangoG4UITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: EitangoAppUITests

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eitango.g4.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

    dependencies:
      - target: EitangoG4

schemes:
  EitangoApp:
    build:
      targets:
        EitangoApp: all
        EitangoAppTests: [test]
        EitangoAppUITests: [test]
    # シミュレータにはApp Storeが無いため、StoreKitの設定ファイルを指定しないと
    # 商品情報を取得できず、購入画面の価格が「読み込んでいます」のままになる。
    # 審査用のスクリーンショットは価格が見えていなければならない。
    run:
      config: Debug
      storeKitConfiguration: Editions/G2/Products.storekit
    # テスト実行時のストアはUIテスト側が SKTestSession で用意する。
    # ここで指定するとストアフロントを米国から変えられず、審査用の画像がドル表記になる。
    test:
      config: Debug
      targets:
        - EitangoAppTests
        - EitangoAppUITests
    archive:
      config: Release

  # テストは G2 のスキームでのみ回す。共通コードは同一で、級ごとに回しても
  # 同じものを確かめるだけになるため（実装指示書 P0-4）。
  # 無料エディションは storeKitConfiguration を持たない（商品が無い）
  EitangoG3:
    build:
      targets:
        EitangoG3: all
        EitangoG3UITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EitangoG3UITests
    archive:
      config: Release

  EitangoG4:
    build:
      targets:
        EitangoG4: all
        EitangoG4UITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EitangoG4UITests
    archive:
      config: Release

  EitangoGP1:
    build:
      targets:
        EitangoGP1: all
        EitangoGP1UITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Editions/GP1/Products.storekit
    test:
      config: Debug
      targets:
        - EitangoGP1UITests
    archive:
      config: Release

  EitangoG1:
    build:
      targets:
        EitangoG1: all
        EitangoG1UITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Editions/G1/Products.storekit
    test:
      config: Debug
      targets:
        - EitangoG1UITests
    archive:
      config: Release

  EitangoGP2:
    build:
      targets:
        EitangoGP2: all
        EitangoGP2UITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Editions/GP2/Products.storekit
    # G2 と同じく、テスト実行時のストアはUIテスト側が SKTestSession で用意する。
    # ここで指定するとストアフロントを米国から変えられず、審査用の画像がドル表記になる。
    test:
      config: Debug
      targets:
        - EitangoGP2UITests
    archive:
      config: Release
