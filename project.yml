name: EitangoApp

options:
  bundleIdPrefix: com.eitango.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  EitangoApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: EitangoApp
        excludes:
          - "App/Info.plist"

    info:
      path: EitangoApp/App/Info.plist

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eitango.app
        PRODUCT_NAME: 英検2級 英単語特訓
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES

  EitangoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: EitangoAppUITests

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eitango.app.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

    dependencies:
      - target: EitangoApp

schemes:
  EitangoApp:
    build:
      targets:
        EitangoApp: all
        EitangoAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EitangoAppUITests
    archive:
      config: Release
